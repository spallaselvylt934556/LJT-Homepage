name: Build and Deploy LJT Homepage

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Build and verify without deploying'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - uses: actions/configure-pages@v6.0.0
        id: pages
        if: ${{ !inputs.verify_only }}
        with:
          enablement: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v5.0.0
        if: ${{ !inputs.verify_only }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.verify_only }}
        with:
          name: homepage-static-build
          path: _site/
          retention-days: 1
  deploy:
    if: ${{ !inputs.verify_only }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
