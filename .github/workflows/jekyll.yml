name: Build and Deploy LJT Homepage

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Build and verify without deploying'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - uses: actions/configure-pages@v6.0.0
        id: pages
        if: ${{ !inputs.verify_only }}
        with:
          enablement: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify homepage content
        if: ${{ inputs.verify_only }}
        run: |-
          ruby <<'RUBY'
          require 'nokogiri'
          require 'uri'

          home = Nokogiri::HTML(File.read('_site/index.html'))
          papers = Nokogiri::HTML(File.read('_site/publications/index.html'))
          expected = [
            'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
            'On the Perception Bottleneck of VLMs for Chart Understanding',
            'On the Universal Truthfulness Hyperplane Inside LLMs',
            'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
            'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
            'Composing Parameter-Efficient Modules with Arithmetic Operations'
          ]
          home_titles = home.css('h2.archive__item-title').map(&:text).map(&:strip)
          paper_titles = papers.css('h2.archive__item-title').map(&:text).map(&:strip)
          abort('Publication list mismatch in home/about') unless home_titles == expected
          abort('Publication list mismatch in publications') unless paper_titles == expected
          abort('Home publication list must match publications section') unless home.css('.list__item').map(&:content) == papers.css('.list__item').map(&:content)
          abort('Missing personal details') unless home.text.include?('first-year PhD candidate') && home.text.include?('Professor Junxian He')
          abort('Missing contact information') unless home.css('a').any? { |a| a['href'] == 'mailto:jliugi@connect.ust.hk' }
          abort('Missing education or experience') unless %w[MINIMAX WXG Zifei Shan Yu\ Cheng June\ 2023 B.Eng. Zhiyuan\ Honor\ Scholarship].all? { |text| home.text.include?(text) }
          abort('Missing skills') unless home.css('h2').any? { |heading| heading.text.strip == 'Skills' }
          abort('Unrelated pages remain') unless Dir['_site/**/*.html'].map { |file| file.delete_prefix('_site/') }.sort == ['404.html', 'about.html', 'about/index.html', 'index.html', 'publications/index.html'].sort
          puts 'Verified: all six publications are present and identical on both sections; personal, academic, skills, and contact content is present.'
          RUBY
      - uses: actions/upload-pages-artifact@v5.0.0
        if: ${{ !inputs.verify_only }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.verify_only }}
        with:
          name: homepage-static-build
          path: _site/
          retention-days: 1
  deploy:
    if: ${{ !inputs.verify_only }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
